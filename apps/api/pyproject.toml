[tool.poetry]
name = "regiq-api"
version = "0.1.0"
description = "REGIQ - AI-Powered Regression Intelligence Platform API"
authors = ["REGIQ Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.6"
alembic = "^1.14.0"
pydantic = "^2.10.0"
email-validator = "^2.2.0"
pydantic-settings = "^2.7.0"
motor = "^3.6.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}
pyjwt = {extras = ["crypto"], version = "^2.10.0"}
bcrypt = "^4.2.0"
python-multipart = "^0.0.18"
openpyxl = "^3.1.5"
lxml = "^5.3.0"
httpx = "^0.28.0"
celery = {extras = ["redis"], version = "^5.4.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
fastapi-limiter = "^0.1.6"

# ── Phase 2: AI / NLP ────────────────────────────────────
beautifulsoup4 = "^4.12.0"
spacy = "^3.7.0"
transformers = "^4.40.0"
torch = "^2.3.0"
sentence-transformers = "^3.0.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"

# ── Phase 2: Graph DB (Neo4j) ────────────────────────────
neo4j = "^5.20.0"

# ── Phase 2: Vector Store (pgvector) ─────────────────────
pgvector = "^0.3.0"

# ── Phase 2: MLOps ───────────────────────────────────────
mlflow = "^2.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
